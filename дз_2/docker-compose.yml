version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./app
    environment:
      APP_ENV: "dev"
      DATABASE_URL: "postgresql+psycopg2://marketplace:marketplace@db:5432/marketplace"
      ACCESS_TOKEN_EXPIRES_MINUTES: "30"
      REFRESH_TOKEN_EXPIRES_DAYS: "14"
      ORDER_RATE_LIMIT_MINUTES: "5"
      JWT_SECRET_KEY: "change_me_access"
      JWT_REFRESH_SECRET_KEY: "change_me_refresh"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      - db

volumes:
  pgdata:
