openapi: 3.0.3
info:
  title: Flight Service API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /v1/flights/search:
    post:
      summary: Search flights
      operationId: searchFlights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFlightsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFlightsResponse'
        '400':
          description: Invalid request
        '500':
          description: Server error
  /v1/flights/{flight_id}:
    get:
      summary: Get flight by ID
      operationId: getFlight
      parameters:
        - name: flight_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFlightResponse'
        '404':
          description: Not found
        '500':
          description: Server error
  /v1/reservations:
    post:
      summary: Reserve seats
      operationId: reserveSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveSeatsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveSeatsResponse'
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: Already exists
        '429':
          description: No seats
        '500':
          description: Server error
  /v1/reservations/{booking_id}/release:
    post:
      summary: Release reservation
      operationId: releaseReservation
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseReservationResponse'
        '404':
          description: Not found
        '500':
          description: Server error
components:
  schemas:
    SearchFlightsRequest:
      type: object
      required: [origin, destination]
      properties:
        origin:
          type: string
          example: SVO
        destination:
          type: string
          example: LED
        departure_date:
          type: string
          format: date-time
    SearchFlightsResponse:
      type: object
      properties:
        flights:
          type: array
          items:
            $ref: '#/components/schemas/Flight'
    GetFlightResponse:
      type: object
      properties:
        flight:
          $ref: '#/components/schemas/Flight'
    ReserveSeatsRequest:
      type: object
      required: [flight_id, booking_id, seat_count]
      properties:
        flight_id:
          type: string
        booking_id:
          type: string
        seat_count:
          type: integer
          format: int32
          minimum: 1
    ReserveSeatsResponse:
      type: object
      properties:
        reservation:
          $ref: '#/components/schemas/SeatReservation'
    ReleaseReservationResponse:
      type: object
      properties:
        reservation:
          $ref: '#/components/schemas/SeatReservation'
    Flight:
      type: object
      properties:
        id:
          type: string
        airline:
          type: string
        flight_number:
          type: string
        origin:
          type: string
        destination:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        total_seats:
          type: integer
          format: int32
        available_seats:
          type: integer
          format: int32
        price_cents:
          type: integer
          format: int64
        status:
          type: string
          enum: [FLIGHT_STATUS_UNSPECIFIED, FLIGHT_STATUS_SCHEDULED, FLIGHT_STATUS_DEPARTED, FLIGHT_STATUS_CANCELLED, FLIGHT_STATUS_COMPLETED]
    SeatReservation:
      type: object
      properties:
        id:
          type: string
        flight_id:
          type: string
        booking_id:
          type: string
        seat_count:
          type: integer
          format: int32
        status:
          type: string
          enum: [RESERVATION_STATUS_UNSPECIFIED, RESERVATION_STATUS_ACTIVE, RESERVATION_STATUS_RELEASED, RESERVATION_STATUS_EXPIRED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
