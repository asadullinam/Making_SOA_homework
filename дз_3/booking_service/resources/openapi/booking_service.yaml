openapi: 3.0.3
info:
  title: Booking Service HTTP API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /flights:
    get:
      summary: Search flights
      operationId: searchFlights
      parameters:
        - in: query
          name: origin
          required: true
          schema:
            type: string
          example: SVO
        - in: query
          name: destination
          required: true
          schema:
            type: string
          example: LED
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          example: 2026-03-18
      responses:
        '200':
          description: Flights found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flight'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /flights/{id}:
    get:
      summary: Get flight by ID
      operationId: getFlight
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flight found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flight'
        '404':
          description: Flight not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings:
    post:
      summary: Create booking
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Flight not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Seat reservation conflict or no seats available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List bookings by user
      operationId: listBookings
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bookings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          description: Missing user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings/{id}:
    get:
      summary: Get booking by ID
      operationId: getBooking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings/{id}/cancel:
    post:
      summary: Cancel booking
      operationId: cancelBooking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Booking already canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Flight service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateBookingRequest:
      type: object
      required:
        - user_id
        - flight_id
        - passenger_name
        - passenger_email
        - seat_count
      properties:
        user_id:
          type: string
          example: user-123
        flight_id:
          type: string
          example: flight-001
        passenger_name:
          type: string
          example: Ivan Ivanov
        passenger_email:
          type: string
          format: email
          example: ivan@example.com
        seat_count:
          type: integer
          format: int32
          minimum: 1
          example: 2
    Booking:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        flight_id:
          type: string
        passenger_name:
          type: string
        passenger_email:
          type: string
          format: email
        seat_count:
          type: integer
          format: int32
        total_price_cents:
          type: integer
          format: int64
        status:
          type: string
          example: CONFIRMED
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Flight:
      type: object
      properties:
        id:
          type: string
        airline:
          type: string
        flight_number:
          type: string
        origin:
          type: string
        destination:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        total_seats:
          type: integer
          format: int32
        available_seats:
          type: integer
          format: int32
        price_cents:
          type: integer
          format: int64
        status:
          type: string
          example: FLIGHT_STATUS_SCHEDULED
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
