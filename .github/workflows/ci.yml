name: dz7-ci

on:
  push:
    paths:
      - "dz7/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "dz7/**"
      - ".github/workflows/ci.yml"

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dz7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docker compose
        run: docker compose config >/dev/null

      - name: Build services
        run: docker compose build producer-service aggregation-service tests

      - name: Unit tests for producer-service
        run: |
          python -m pip install --upgrade pip
          pip install -r producer-service/requirements.txt
          PYTHONPATH=producer-service pytest -q producer-service/tests

      - name: Unit tests for aggregation-service
        run: |
          pip install -r aggregation-service/requirements.txt
          PYTHONPATH=aggregation-service pytest -q aggregation-service/tests

      - name: Start stack
        run: docker compose up -d

      - name: Wait for healthy services
        run: |
          for url in \
            http://localhost:8000/health \
            http://localhost:8001/health \
            http://localhost:9090/-/healthy \
            http://localhost:3000/api/health \
            http://localhost:9093/-/healthy; do
            echo "Waiting for $url"
            timeout 180 bash -c "until curl -fsS $url >/dev/null; do sleep 5; done"
          done

      - name: Integration tests
        run: docker compose --profile test run --rm tests pytest -q test_integration.py

      - name: End-to-end tests
        run: docker compose --profile test run --rm tests pytest -q test_e2e.py

      - name: Load tests
        run: docker compose --profile load run --rm k6

      - name: Validate Prometheus metrics and SLI thresholds
        run: docker compose --profile test run --rm -e RESULTS_FILE=/tests/artifacts/metrics-validation.json tests python validate_metrics.py

      - name: Export logs and alert state
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log || true
          curl -fsS http://localhost:9090/api/v1/rules > artifacts/prometheus-rules.json || true
          curl -fsS http://localhost:9093/api/v2/alerts > artifacts/alertmanager-alerts.json || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dz7-ci-artifacts
          path: dz7/artifacts

      - name: Stop stack
        if: always()
        run: docker compose down -v
